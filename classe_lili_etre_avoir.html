<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classe de Lili — 6 questions par pronom</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Trebuchet MS',sans-serif;background:linear-gradient(125deg,#e8f9ff,#fff0d9);color:#352657;margin:0}.wrap{max-width:780px;margin:auto;padding:15px}.header{background:white;border-radius:20px;padding:12px 18px;display:flex;gap:14px;align-items:center;border:3px solid #d9baff}.lili{font-size:62px}.say{font-weight:850;font-size:clamp(19px,3.4vw,27px)}h1{text-align:center;font-size:clamp(24px,4vw,36px);margin:12px}.panel{margin-top:14px;background:#fff;border:5px solid #a5dfd0;border-radius:30px;min-height:370px;padding:24px;text-align:center;box-shadow:0 7px #d6e8df}.panel.avoir{border-color:#f2cc83}.mini{font-size:18px;font-weight:850;color:#6d5c88}.verb{font-size:clamp(24px,4vw,36px);font-weight:950;margin:12px}.rule{font-size:clamp(34px,6vw,53px);font-weight:950;color:#0a7a56;background:#e8fff0;border-radius:18px;padding:12px}.avoir .rule{color:#a25b12;background:#fff5df}.pic{font-size:95px;margin:10px}.example{font-size:clamp(23px,4vw,34px);font-weight:900}.question{font-size:clamp(28px,5vw,43px);font-weight:950;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:22px auto}.options button{font-size:clamp(24px,4vw,35px);font-weight:950;border:3px solid #a78be1;border-radius:19px;background:#f2ecff;padding:20px;cursor:pointer}.options button:disabled{opacity:.75;cursor:default}.options button.correct{background:#c8f8d7;border-color:#36a568}.options button.wrong{background:#ffe0de;border-color:#d96764}.feedback{min-height:35px;font-size:24px;font-weight:850}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px}.nav button{background:#7954b6;color:white;font-size:18px;font-weight:900;padding:12px 17px;border:0;border-radius:13px;cursor:pointer}.nav button:disabled{opacity:.35}.counter{font-size:15px;font-weight:900;text-align:center}.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.item{border-radius:14px;background:#f0f7ff;padding:14px;font-size:clamp(20px,3vw,28px);font-weight:900}.note{text-align:center;font-size:13px;color:#66577a;margin:16px}@media(max-width:480px){.wrap{padding:9px}.panel{padding:13px;min-height:355px}.lili{font-size:48px}.options button{padding:14px}.nav button{font-size:14px;padding:11px}.recap{gap:6px}.item{padding:10px}}</style></head><body><div class="wrap"><h1>🌈 La classe de Lili</h1><div class="header"><div class="lili">👩‍🏫</div><div class="say" id="say">Regarde et apprends !</div></div><div class="panel" id="panel"></div><div class="nav"><button id="back">⬅ Retour</button><div class="counter" id="counter"></div><button id="next">Suivant ➡</button></div><div class="note">🌟 Une question à la fois. Prends ton temps !</div></div><script>
const pronouns=[["être", "Je", "suis", "😄", "Je suis content."], ["être", "Tu", "es", "🎒", "Tu es prêt."], ["être", "Il", "est", "⚽", "Il est sportif."], ["être", "Elle", "est", "🌸", "Elle est heureuse."], ["être", "Nous", "sommes", "👫", "Nous sommes amis."], ["être", "Vous", "êtes", "🎉", "Vous êtes contents."], ["être", "Ils", "sont", "👦", "Ils sont joyeux."], ["être", "Elles", "sont", "👧", "Elles sont heureuses."], ["avoir", "J’", "ai", "📘", "J’ai un livre."], ["avoir", "Tu", "as", "🚲", "Tu as un vélo."], ["avoir", "Il", "a", "🐶", "Il a un chien."], ["avoir", "Elle", "a", "🌼", "Elle a une fleur."], ["avoir", "Nous", "avons", "✏️", "Nous avons des crayons."], ["avoir", "Vous", "avez", "🍎", "Vous avez des pommes."], ["avoir", "Ils", "ont", "🧸", "Ils ont des jouets."], ["avoir", "Elles", "ont", "🦋", "Elles ont des papillons."]];
const screens=[];
pronouns.forEach((p,i)=>{screens.push({kind:'lesson',p,i});for(let q=0;q<6;q++)screens.push({kind:'question',p,i,q});if(i===7||i===15)screens.push({kind:'recap',verb:p[0]})});
let current=0;const answered={};const $=x=>document.getElementById(x);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function show(){const s=screens[current],panel=$('panel');panel.replaceChildren();panel.className='panel'+((s.verb==='avoir'||s.p?.[0]==='avoir')?' avoir':'');let say='';if(s.kind==='recap'){say='Bravo ! On révise !';panel.append(el('div','verb','⭐ Je retiens : '+s.verb.toUpperCase()));const grid=el('div','recap');pronouns.filter(p=>p[0]===s.verb).forEach(p=>grid.append(el('div','item',p[1]+' → '+p[2])));panel.append(grid)}else{const [verb,pr,form,emoji,sentence]=s.p;panel.append(el('div','mini',verb.toUpperCase()+' · '+(s.i%8+1)+'/8'));if(s.kind==='lesson'){say='Regarde ! '+pr+' → '+form;panel.append(el('div','verb','👀 Regarde !'));panel.append(el('div','rule',pr+' → '+form));panel.append(el('div','pic',emoji));panel.append(el('div','example',sentence))}else{say='Choisis le bon mot !';panel.append(el('div','mini','Question '+(s.q+1)+' / 6'));const nouns=verb==='être'?['content','prêt','ici','heureux','en classe','à la maison']:['un livre','un ballon','une pomme','un crayon','un sac','des jouets'];const prefix=pr==='J’'?'J’':pr+' ';const suffix=nouns[s.q];panel.append(el('div','question',prefix+' ___ '+suffix+' .'));const wrongForms=verb==='être'?['suit','et','ait','ait','somme','ète','son','son']:['est','à','à','à','avont','avé','on','on'];const bad=wrongForms[s.i%8];const opts=el('div','options');const words=s.q%2?[bad,form]:[form,bad];words.forEach(word=>{const btn=el('button','',word);btn.onclick=()=>{if(answered[current])return;answered[current]=word===form?'correct':'wrong';Array.from(opts.children).forEach(b=>{b.disabled=true;b.classList.add(b.textContent===form?'correct':b===btn?'wrong':'')});$('feedback').textContent=word===form?'🌟 Bravo !':'💡 Essaie de retenir : '+pr+' → '+form};opts.append(btn)});panel.append(opts);const feedback=el('div','feedback','');feedback.id='feedback';panel.append(feedback);if(answered[current]){Array.from(opts.children).forEach(b=>{b.disabled=true;if(b.textContent===form)b.classList.add('correct')});feedback.textContent=answered[current]==='correct'?'🌟 Bravo !':'💡 Essaie de retenir : '+pr+' → '+form}}}$('say').textContent=say;$('counter').textContent=(current+1)+' / '+screens.length;$('back').disabled=current===0;$('next').disabled=current===screens.length-1}
$('back').onclick=()=>{if(current>0){current--;show()}};$('next').onclick=()=>{if(current<screens.length-1){current++;show()}};show();
</script></body></html>
