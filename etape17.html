<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Étape 17</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf5ef;color:#183e35;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{background:#d3eade;padding:9px 15px;border-radius:18px;font-weight:700}h1{font-size:clamp(28px,5vw,40px)}.panel{background:white;border-radius:26px;padding:clamp(20px,4vw,38px);box-shadow:0 10px 35px #174b3c18;min-height:430px}p,.story{font-size:23px;line-height:1.65}.story{white-space:pre-line;background:#f1f9f3;border-radius:20px;padding:24px}.picture{text-align:center;font-size:72px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}button,.link{font-size:20px;padding:15px;border-radius:16px;border:0;background:#147d59;color:white;cursor:pointer;font-weight:650}.options button{background:#d9eee2;color:#174b3c}.options button:hover{background:#bee2cb}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.secondary{background:#e0efe6;color:#185740}.feedback{min-height:40px;font-size:22px;font-weight:bold;color:#176a4d}textarea{width:100%;font:22px/1.5 system-ui;min-height:135px;border:2px solid #a8ceb5;border-radius:14px;padding:16px}input{font-size:21px;padding:12px;border:2px solid #a8ceb5;border-radius:12px;width:100%}.bar{height:13px;background:#d9e7de;border-radius:12px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#e5b638;width:0}.small{font-size:17px;color:#516e60}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.badge{background:#e6f4e8;padding:8px 12px;border-radius:12px}.prompt{font-size:26px;font-weight:700}a{color:#11684c}button:focus-visible,a:focus-visible{outline:3px solid #df9b0a;outline-offset:3px}</style></head><body><main class="wrap"><div class="top"><span class="tag">📚 FrançaisRoute</span><span class="tag" id="stage"></span></div><h1>J’écris des phrases et des textes</h1><p>Construis des phrases, complète-les et écris de courts textes.</p><div class="bar"><div class="fill" id="fill"></div></div><section class="panel"><div id="area"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls" id="controls"></div></section><p class="small">🔊 La voix fonctionne uniquement après un clic. Les réponses ne sont pas transmises à un serveur.</p><p><a href="index.html">← Retour au parcours</a></p></main><script>
const DATA=[{"title": "Je construis une phrase", "emoji": "🐕", "prompt": "Remets les mots en ordre.", "tokens": ["Le", "chien", "joue", "."], "answer": "Le chien joue.", "tip": "Une phrase commence par une majuscule."}, {"title": "Je construis une phrase", "emoji": "🍎", "prompt": "Remets les mots en ordre.", "tokens": ["Mila", "mange", "une", "pomme", "."], "answer": "Mila mange une pomme.", "tip": "Les mots suivent un ordre logique."}, {"title": "Je construis une phrase", "emoji": "🌞", "prompt": "Remets les mots en ordre.", "tokens": ["Il", "fait", "beau", "."], "answer": "Il fait beau.", "tip": "Une phrase se termine par un signe."}, {"title": "Je complète une phrase", "emoji": "📖", "prompt": "Écris le mot manquant : Je lis un _____.", "answer": "livre", "tip": "Observe l’image."}, {"title": "Je complète une phrase", "emoji": "🐈", "prompt": "Écris le mot manquant : Le _____ dort.", "answer": "chat", "tip": "Observe l’image."}, {"title": "Je décris une image", "emoji": "🏠🌳", "prompt": "Écris une phrase sur cette image.", "tip": "Écris qui ou quoi, puis une action."}, {"title": "Je décris une image", "emoji": "🧒⚽", "prompt": "Écris une phrase sur cette image.", "tip": "Commence par une majuscule."}, {"title": "J’écris un petit texte", "emoji": "🐶", "prompt": "Écris trois phrases sur un animal.", "tip": "Présente l’animal. Décris-le. Dis ce qu’il fait."}, {"title": "J’écris un petit texte", "emoji": "🎒🏫", "prompt": "Écris trois phrases sur ton école.", "tip": "Présente le lieu. Décris une activité. Dis ce que tu aimes."}];let step=0,answers=[],selection=[],finished=false;
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function say(t){if(!('speechSynthesis' in window)){ $('feedback').textContent='La lecture vocale est indisponible.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-CA';u.rate=.8;speechSynthesis.speak(u)}
function button(t,fn,secondary=false){const b=el('button',secondary?'secondary':'',t);b.onclick=fn;return b}
function next(){step++;selection=[];render()}
function render(){const area=$('area'),ctrl=$('controls');area.replaceChildren();ctrl.replaceChildren();$('feedback').textContent='';
$('stage').textContent=step>=DATA.length?'Terminé':`Activité ${step+1} / ${DATA.length}`;
$('fill').style.width=`${Math.min(100,step/DATA.length*100)}%`;
if(step>=DATA.length){area.append(el('div','picture','🌟'));area.append(el('h2','', 'Bravo, tu as terminé !'));area.append(el('p','', 'Tu peux refaire les activités pour t’entraîner.'));ctrl.append(button('🔁 Recommencer',()=>{step=0;answers=[];render()}));return}
const x=DATA[step];area.append(el('div','picture',x.emoji));area.append(el('h2','',x.title));
if("write"==='read'){area.append(el('div','story',x.text));ctrl.append(button('🔊 Écouter le texte',()=>say(x.text),true));
let qi=0;const ask=()=>{const old=$('question');if(old)old.remove();const block=el('div','',undefined);block.id='question';const q=x.qs[qi];block.append(el('p','prompt',q[0]));const opts=el('div','options');q[1].forEach((v,i)=>opts.append(button(v,()=>{if(i===q[2]){$('feedback').textContent='⭐ Bonne réponse !';block.querySelectorAll('button').forEach(b=>b.disabled=true);const go=button(qi===x.qs.length-1?'➜ Texte suivant':'➜ Question suivante',()=>{qi++;if(qi===x.qs.length)next();else{ $('feedback').textContent='';ask();}});block.append(go)}else $('feedback').textContent='Relis le texte et réessaie.'},true)));block.append(opts);area.append(block)};ask();
}else{
area.append(el('p','prompt',x.prompt));area.append(el('p','small',x.tip));
if(x.tokens){const available=el('div','options');const output=el('p','badge','Ta phrase : ');function redraw(){output.textContent='Ta phrase : '+selection.map(i=>x.tokens[i]).join(' ');available.replaceChildren();x.tokens.forEach((t,i)=>{if(!selection.includes(i))available.append(button(t,()=>{selection.push(i);redraw()},true))})}redraw();area.append(available,output);ctrl.append(button('↩ Effacer',()=>{selection=[];redraw()},true));ctrl.append(button('✔ Vérifier',()=>{const value=selection.map(i=>x.tokens[i]).join(' ').replace(/\s+([.!?])/g,'$1');if(value===x.answer){$('feedback').textContent='⭐ Bravo !';ctrl.append(button('➜ Suivant',next))}else $('feedback').textContent='Vérifie l’ordre des mots.'}));}
else{const field=el(x.answer?'input':'textarea');field.setAttribute('aria-label','Ta réponse');field.placeholder='Écris ici…';area.append(field);
ctrl.append(button('🔊 Écouter la consigne',()=>say(x.prompt),true));
ctrl.append(button('✔ Vérifier',()=>{const value=field.value.trim();if(!value){$('feedback').textContent='Écris une réponse avant de continuer.';return}if(x.answer){if(value.toLocaleLowerCase('fr').replace(/[.!?]$/,'')===x.answer){$('feedback').textContent='⭐ Bonne réponse !';ctrl.append(button('➜ Suivant',next))}else $('feedback').textContent='Essaie encore. Regarde l’image.'}
else {answers.push({consigne:x.prompt,reponse:value});$('feedback').textContent='⭐ Ton texte est enregistré dans cette page. Fais-le relire par ton enseignante.';ctrl.append(button('➜ Suivant',next));}}));
}
}
}
render();
</script></body></html>
