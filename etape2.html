<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Étape 2</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#173b39;background:#e9f6ee}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:22px auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{background:#d0e9d8;border-radius:20px;padding:8px 16px;font-weight:700}h1{font-size:clamp(26px,5vw,38px);margin:12px 0}p{font-size:22px;line-height:1.5}.panel{background:white;border-radius:30px;box-shadow:0 14px 36px #1d5c3830;padding:clamp(20px,4vw,40px);min-height:460px;text-align:center}.big{font-size:clamp(78px,16vw,140px);font-weight:800;color:#137b5b;line-height:1.25}.picture{font-size:90px;display:block}.controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{cursor:pointer;border:0;border-radius:18px;padding:15px 22px;font-size:22px;font-weight:700;background:#117b5c;color:white;min-height:62px}button.secondary{background:#e1efe6;color:#185740}button:focus-visible{outline:4px solid orange;outline-offset:3px}.choices{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:25px}.choice{min-width:110px;background:#e8f5eb;color:#174b3c;border:3px solid #bad9c6;font-size:35px}.choice:hover{background:#d3eadd}.feedback{font-weight:700;min-height:36px;color:#17654b}.progress{height:13px;background:#d9e7de;border-radius:20px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:#e9b52e;transition:width .25s}.tiny{font-size:16px;color:#536b5e}.hidden{display:none}#teacher{margin-top:18px;background:#f8fff9;padding:15px;border-radius:18px;font-size:16px}#teacher p{font-size:16px}#teacher summary{cursor:pointer;font-weight:700} .syllable{display:inline-block;background:#e8f5eb;border-radius:20px;padding:10px 18px;margin:5px;font-size:clamp(48px,10vw,82px);font-weight:800;color:#137b const lessons=[{"emoji": "🏠", "word": "maison", "theme": "Je lis : ma", "say": "Écoute : ma. maison.", "pieces": ["m", "a"], "result": "ma"}, {"emoji": "🎤", "word": "micro", "theme": "Je lis : mi", "say": "Écoute : mi. micro.", "pieces": ["m", "i"], "result": "mi"}, {"emoji": "🏍️", "word": "moto", "theme": "Je lis : mo", "say": "Écoute : mo. moto.", "pieces": ["m", "o"], "result": "mo"}, {"emoji": "🎵", "word": "musique", "theme": "Je lis : mu", "say": "Écoute : mu. musique.", "pieces": ["m", "u"], "result": "mu"}, {"emoji": "👨", "word": "papa", "theme": "Je lis : pa", "say": "Écoute : pa. papa.", "pieces": ["p", "a"], "result": "pa"}, {"emoji": "🏴‍☠️", "word": "pirate", "theme": "Je lis : pi", "say": "Écoute : pi. pirate.", "pieces": ["p", "i"], "result": "pi"}, {"emoji": "🍎", "word": "pomme", "theme": "Je lis : po", "say": "Écoute : po. pomme.", "pieces": ["p", "o"], "result": "po"}, {"emoji": "🧥", "word": "pull", "theme": "Je lis : pu", "say": "Écoute : pu. pull.", "pieces": ["p", "u"], "result": "pu"}, {"emoji": "🐰", "word": "lapin", "theme": "Je lis : la", "say": "Écoute : la. lapin.", "pieces": ["l", "a"], "result": "la"}, {"emoji": "📖", "word": "livre", "theme": "Je lis : li", "say": "Écoute : li. livre.", "pieces": ["l", "i"], "result": "li"}, {"emoji": "🪷", "word": "lotus", "theme": "Je lis : lo", "say": "Écoute : lo. lotus.", "pieces": ["l", "o"], "result": "lo"}, {"emoji": "🌙", "word": "lune", "theme": "Je lis : lu", "say": "Écoute : lu. lune.", "pieces": ["l", "u"], "result": "lu"}, {"emoji": "🥗", "word": "salade", "theme": "Je lis : sa", "say": "Écoute : sa. salade.", "pieces": ["s", "a"], "result": "sa"}, {"emoji": "🧜", "word": "sirène", "theme": "Je lis : si", "say": "Écoute : si. sirène.", "pieces": ["s", "i"], "result": "si"}, {"emoji": "☀️", "word": "soleil", "theme": "Je lis : so", "say": "Écoute : so. soleil.", "pieces": ["s", "o"], "result": "so"}, {"emoji": "🍬", "word": "sucre", "theme": "Je lis : su", "say": "Écoute : su. sucre.", "pieces": ["s", "u"], "result": "su"}, {"emoji": "🌶️", "word": "radis", "theme": "Je lis : ra", "say": "Écoute : ra. radis.", "pieces": ["r", "a"], "result": "ra"}, {"emoji": "🍚", "word": "riz", "theme": "Je lis : ri", "say": "Écoute : ri. riz.", "pieces": ["r", "i"], "result": "ri"}, {"emoji": "🤖", "word": "robot", "theme": "Je lis : ro", "say": "Écoute : ro. robot.", "pieces": ["r", "o"], "result": "ro"}, {"emoji": "🏘️", "word": "rue", "theme": "Je lis : ru", "say": "Écoute : ru. rue.", "pieces": ["r", "u"], "result": "ru"}, {"emoji": "🪑", "word": "table", "theme": "Je lis : ta", "say": "Écoute : ta. table.", "pieces": ["t", "a"], "result": "ta"}, {"emoji": "🐯", "word": "tigre", "theme": "Je lis : ti", "say": "Écoute : ti. tigre.", "pieces": ["t", "i"], "result": "ti"}, {"emoji": "🍅", "word": "tomate", "theme": "Je lis : to", "say": "Écoute : to. tomate.", "pieces": ["t", "o"], "result": "to"}, {"emoji": "🌷", "word": "tulipe", "theme": "Je lis : tu", "say": "Écoute : tu. tulipe.", "pieces": ["t", "u"], "result": "tu"}, {"emoji": "👨", "word": "papa", "theme": "Je forme un mot", "say": "pa. pa. papa.", "pieces": ["pa", "pa"], "result": "papa"}, {"emoji": "🦙", "word": "lama", "theme": "Je forme un mot", "say": "la. ma. lama.", "pieces": ["la", "ma"], "result": "lama"}, {"emoji": "🏍️", "word": "moto", "theme": "Je forme un mot", "say": "mo. to. moto.", "pieces": ["mo", "to"], "result": "moto"}];
const exercises=[{"q": "🏠 maison", "s": "Quelle syllabe commence maison ?", "opts": ["ma", "pi", "lu"], "a": "ma"}, {"q": "🎤 micro", "s": "Quelle syllabe commence micro ?", "opts": ["po", "sa", "mi"], "a": "mi"}, {"q": "🏍️ moto", "s": "Quelle syllabe commence moto ?", "opts": ["si", "mo", "pu"], "a": "mo"}, {"q": "🎵 musique", "s": "Quelle syllabe commence musique ?", "opts": ["mu", "la", "so"], "a": "mu"}, {"q": "👨 papa", "s": "Quelle syllabe commence papa ?", "opts": ["li", "su", "pa"], "a": "pa"}, {"q": "🏴‍☠️ pirate", "s": "Quelle syllabe commence pirate ?", "opts": ["ra", "pi", "lo"], "a": "pi"}, {"q": "🍎 pomme", "s": "Quelle syllabe commence pomme ?", "opts": ["po", "lu", "ri"], "a": "po"}, {"q": "🧥 pull", "s": "Quelle syllabe commence pull ?", "opts": ["sa", "ro", "pu"], "a": "pu"}, {"q": "🐰 lapin", "s": "Quelle syllabe commence lapin ?", "opts": ["ru", "la", "si"], "a": "la"}, {"q": "📖 livre", "s": "Quelle syllabe commence livre ?", "opts": ["li", "so", "ta"], "a": "li"}, {"q": "🪷 lotus", "s": "Quelle syllabe commence lotus ?", "opts": ["su", "ti", "lo"], "a": "lo"}, {"q": "🌙 lune", "s": "Quelle syllabe commence lune ?", "opts": ["to", "lu", "ra"], "a": "lu"}, {"q": "🥗 salade", "s": "Quelle syllabe commence salade ?", "opts": ["sa", "ri", "tu"], "a": "sa"}, {"q": "🧜 sirène", "s": "Quelle syllabe commence sirène ?", "opts": ["ro", "ma", "si"], "a": "si"}, {"q": "☀️ soleil", "s": "Quelle syllabe commence soleil ?", "opts": ["mi", "so", "ru"], "a": "so"}, {"q": "🍬 sucre", "s": "Quelle syllabe commence sucre ?", "opts": ["su", "ta", "mo"], "a": "su"}, {"q": "🌶️ radis", "s": "Quelle syllabe commence radis ?", "opts": ["ti", "mu", "ra"], "a": "ra"}, {"q": "🍚 riz", "s": "Quelle syllabe commence riz ?", "opts": ["pa", "ri", "to"], "a": "ri"}, {"q": "🤖 robot", "s": "Quelle syllabe commence robot ?", "opts": ["ro", "tu", "pi"], "a": "ro"}, {"q": "🏘️ rue", "s": "Quelle syllabe commence rue ?", "opts": ["ma", "po", "ru"], "a": "ru"}, {"q": "🪑 table", "s": "Quelle syllabe commence table ?", "opts": ["pu", "ta", "mi"], "a": "ta"}, {"q": "🐯 tigre", "s": "Quelle syllabe commence tigre ?", "opts": ["ti", "mo", "la"], "a": "ti"}, {"q": "🍅 tomate", "s": "Quelle syllabe commence tomate ?", "opts": ["mu", "li", "to"], "a": "to"}, {"q": "🌷 tulipe", "s": "Quelle syllabe commence tulipe ?", "opts": ["lo", "tu", "pa"], "a": "tu"}, {"q": "pa + pa", "s": "Quel mot formes-tu ?", "opts": ["papa", "lama", "moto"], "a": "papa"}, {"q": "la + ma", "s": "Quel mot formes-tu ?", "opts": ["lama", "papa", "moto"], "a": "lama"}, {"q": "mo + to", "s": "Quel mot formes-tu ?", "opts": ["moto", "papa", "lune"], "a": "moto"}];
const homework=[{"q": "🏠 maison", "s": "Quelle syllabe commence maison ?", "opts": ["ma", "pi", "lu"], "a": "ma"}, {"q": "🎤 micro", "s": "Quelle syllabe commence micro ?", "opts": ["po", "sa", "mi"], "a": "mi"}, {"q": "🏍️ moto", "s": "Quelle syllabe commence moto ?", "opts": ["si", "mo", "pu"], "a": "mo"}, {"q": "🎵 musique", "s": "Quelle syllabe commence musique ?", "opts": ["mu", "la", "so"], "a": "mu"}, {"q": "👨 papa", "s": "Quelle syllabe commence papa ?", "opts": ["li", "su", "pa"], "a": "pa"}];
let mode='lesson',idx=0,score=0,locked=false;const $=id=>document.getElementById(id);
function speak(t){if(!('speechSynthesis' in window)){$('feedback').textContent='La voix n’est pas disponible ici.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-CA';u.rate=.78;speechSynthesis.speak(u)}
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function reset(){$('content').replaceChildren();$('actions').replaceChildren();$('feedback').textContent='';locked=false}
function render(){
reset();const c=$('content'),a=$('actions'),total=lessons.length+exercises.length+homework.length;
if(mode==='lesson'){
 const l=lessons[idx];$('stage').textContent='Découverte '+(idx+1)+'/'+lessons.length;
 $('bar').style.width=((idx+1)/total*100)+'%';
 const theme=document.createElement('p');theme.className='hint';theme.textContent=l.theme||'';c.append(theme);
 const pic=document.createElement('span');pic.className='picture';pic.textContent=l.emoji;c.append(pic);
 const word=document.createElement('div');word.className='word';word.textContent=l.word;c.append(word);
 if(l.pieces){const group=document.createElement('div');l.pieces.forEach((piece,i)=>{const s=document.createElement('span');s.className='syllable';s.textContent=piece;group.append(s);if(i<l.pieces.length-1){const sep=document.createElement('span');sep.textContent=' + ';group.append(sep)}});c.append(group);}
 a.append(btn('🔊 Écouter',()=>speak(l.say),'secondary'));
 a.append(btn('➜ Suivant',()=>{if(++idx>=lessons.length){mode='exercise';idx=0;score=0;}render()}));
}else if(mode==='exercise'||mode==='homework'){
 const arr=mode==='exercise'?exercises:homework,x=arr[idx];
 $('stage').textContent=(mode==='exercise'?'Je m’entraîne ':'Petit devoir ')+(idx+1)+'/'+arr.length;
 $('bar').style.width=((lessons.length+(mode==='homework'?exercises.length:0)+idx+1)/total*100)+'%';
 const h=document.createElement('div');h.className='word';h.textContent=x.q;c.append(h);
 const choices=document.createElement('div');choices.className='choices';
 x.opts.forEach(o=>choices.append(btn(o,()=>{if(locked)return;if(o===x.a){locked=true;score++;$('feedback').textContent='⭐ Bravo !';a.append(btn('➜ Suivant',()=>{if(++idx>=arr.length){mode=mode==='exercise'?'end':'done';idx=0;}render()}));}else{$('feedback').textContent='Essaie encore !';}},'choice')));
 c.append(choices);a.append(btn('🔊 Écouter',()=>speak(x.s),'secondary'));
}else{
 const done=mode==='done';$('stage').textContent='Bravo !';$('bar').style.width='100%';
 const star=document.createElement('div');star.className='big';star.textContent='⭐';c.append(star);
 const msg=document.createElement('p');msg.textContent=done?'Devoir terminé !':'Tu as terminé les exercices !';c.append(msg);
 a.append(btn('🔁 Recommencer',()=>{mode='lesson';idx=0;score=0;render()},'secondary'));
 if(!done)a.append(btn('📝 Petit devoir',()=>{mode='homework';idx=0;score=0;render()}));
}}
render();</script></body></html>
