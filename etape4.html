<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Étape 4</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#173b39;background:#e9f6ee}*{box-sizing:border-box}body{margin:0}.shell{max-width:950px;margin:22px auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{background:#d0e9d8;border-radius:20px;padding:8px 16px;font-weight:700}h1{font-size:clamp(26px,5vw,38px);margin:12px 0}p{font-size:22px;line-height:1.5}.panel{background:white;border-radius:30px;box-shadow:0 14px 36px #1d5c3830;padding:clamp(20px,4vw,40px);min-height:460px;text-align:center}.big{font-size:clamp(78px,16vw,140px);font-weight:800;color:#137b5b;line-height:1.25}.picture{font-size:90px;display:block}.controls{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{cursor:pointer;border:0;border-radius:18px;padding:15px 22px;font-size:22px;font-weight:700;background:#117b5c;color:white;min-height:62px}button.secondary{background:#e1efe6;color:#185740}button:focus-visible{outline:4px solid orange;outline-offset:3px}.choices{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:25px}.choice{min-width:110px;background:#e8f5eb;color:#174b3c;border:3px solid #bad9c6;font-size:35px}.choice:hover{background:#d3eadd}.feedback{font-weight:700;min-height:36px;color:#17654b}.progress{height:13px;background:#d9e7de;border-radius:20px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:#e9b52e;transition:width .25s}.tiny{font-size:16px;color:#536b5e}.hidden{display:none}#teacher{margin-top:18px;background:#f8fff9;padding:15px;border-radius:18px;font-size:16px}#teacher p{font-size:16px}#teacher summary{cursor:pointer;font-weight:700} .syllable{display:inline-block;background:#e8f5eb;border-radius:20px;padding:10px 18px;margin:5px;font-size:clamp(48px,10vw,82px);font-weight:800;color:#137b5b}.word{font-size:clamp(42px,9vw,76px);font-weight:800;letter-spacing:2px}.picture{font-size:85px}.hint{font-size:22px;color:#536b5e} </style></head><body><main class="shell"><div class="top"><span class="tag">📚 FrançaisRoute</span><span class="tag" id="stage">Étape 4 / 17</span></div><h1>🔊 Je découvre les sons composés</h1><div class="progress"><div class="fill" id="bar"></div></div><section class="panel" aria-live="polite"><div id="content"></div><div class="controls" id="actions"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><details id="teacher"><summary>👩‍🏫 Notes pour l’enseignante</summary><p>20 exemples guidés, 20 exercices, 5 questions de devoir. Un son à la fois et lecture au clic. Le moteur vocal du navigateur peut varier selon l’appareil.</p></details></main><script>
const lessons=[{"emoji": "🐺", "word": "loup", "theme": "Le son ou", "say": "Écoute : loup. Dans loup, j’entends ou.", "pieces": ["ou"], "result": "ou"}, {"emoji": "🐔", "word": "poule", "theme": "Le son ou", "say": "Écoute : poule. Dans poule, j’entends ou.", "pieces": ["ou"], "result": "ou"}, {"emoji": "🔴", "word": "boule", "theme": "Le son ou", "say": "Écoute : boule. Dans boule, j’entends ou.", "pieces": ["ou"], "result": "ou"}, {"emoji": "🛞", "word": "roue", "theme": "Le son ou", "say": "Écoute : roue. Dans roue, j’entends ou.", "pieces": ["ou"], "result": "ou"}, {"emoji": "🐑", "word": "mouton", "theme": "Le son on", "say": "Écoute : mouton. Dans mouton, j’entends on.", "pieces": ["on"], "result": "on"}, {"emoji": "🎈", "word": "ballon", "theme": "Le son on", "say": "Écoute : ballon. Dans ballon, j’entends on.", "pieces": ["on"], "result": "on"}, {"emoji": "🍬", "word": "bonbon", "theme": "Le son on", "say": "Écoute : bonbon. Dans bonbon, j’entends on.", "pieces": ["on"], "result": "on"}, {"emoji": "🌉", "word": "pont", "theme": "Le son on", "say": "Écoute : pont. Dans pont, j’entends on.", "pieces": ["on"], "result": "on"}, {"emoji": "👩", "word": "maman", "theme": "Le son an", "say": "Écoute : maman. Dans maman, j’entends an.", "pieces": ["an"], "result": "an"}, {"emoji": "🐘", "word": "éléphant", "theme": "Le son an", "say": "Écoute : éléphant. Dans éléphant, j’entends an.", "pieces": ["an"], "result": "an"}, {"emoji": "🧒", "word": "enfant", "theme": "Le son an", "say": "Écoute : enfant. Dans enfant, j’entends an.", "pieces": ["an"], "result": "an"}, {"emoji": "🩳", "word": "pantalon", "theme": "Le son an", "say": "Écoute : pantalon. Dans pantalon, j’entends an.", "pieces": ["an"], "result": "an"}, {"emoji": "🐟", "word": "poisson", "theme": "Le son oi", "say": "Écoute : poisson. Dans poisson, j’entends oi.", "pieces": ["oi"], "result": "oi"}, {"emoji": "🚗", "word": "voiture", "theme": "Le son oi", "say": "Écoute : voiture. Dans voiture, j’entends oi.", "pieces": ["oi"], "result": "oi"}, {"emoji": "🐦", "word": "oiseau", "theme": "Le son oi", "say": "Écoute : oiseau. Dans oiseau, j’entends oi.", "pieces": ["oi"], "result": "oi"}, {"emoji": "👑", "word": "roi", "theme": "Le son oi", "say": "Écoute : roi. Dans roi, j’entends oi.", "pieces": ["oi"], "result": "oi"}, {"emoji": "🐈", "word": "chat", "theme": "Le son ch", "say": "Écoute : chat. Dans chat, j’entends ch.", "pieces": ["ch"], "result": "ch"}, {"emoji": "🐴", "word": "cheval", "theme": "Le son ch", "say": "Écoute : cheval. Dans cheval, j’entends ch.", "pieces": ["ch"], "result": "ch"}, {"emoji": "🐕", "word": "chien", "theme": "Le son ch", "say": "Écoute : chien. Dans chien, j’entends ch.", "pieces": ["ch"], "result": "ch"}, {"emoji": "👕", "word": "chemise", "theme": "Le son ch", "say": "Écoute : chemise. Dans chemise, j’entends ch.", "pieces": ["ch"], "result": "ch"}];
const exercises=[{"q": "🐺 loup", "s": "Écoute loup. Quel son entends-tu ?", "opts": ["ou", "on", "an"], "a": "ou"}, {"q": "🐔 poule", "s": "Écoute poule. Quel son entends-tu ?", "opts": ["an", "oi", "ou"], "a": "ou"}, {"q": "🔴 boule", "s": "Écoute boule. Quel son entends-tu ?", "opts": ["ch", "ou", "oi"], "a": "ou"}, {"q": "🛞 roue", "s": "Écoute roue. Quel son entends-tu ?", "opts": ["ou", "ch", "on"], "a": "ou"}, {"q": "🐑 mouton", "s": "Écoute mouton. Quel son entends-tu ?", "opts": ["on", "ou", "an"], "a": "on"}, {"q": "🎈 ballon", "s": "Écoute ballon. Quel son entends-tu ?", "opts": ["an", "oi", "on"], "a": "on"}, {"q": "🍬 bonbon", "s": "Écoute bonbon. Quel son entends-tu ?", "opts": ["ch", "on", "oi"], "a": "on"}, {"q": "🌉 pont", "s": "Écoute pont. Quel son entends-tu ?", "opts": ["on", "ch", "ou"], "a": "on"}, {"q": "👩 maman", "s": "Écoute maman. Quel son entends-tu ?", "opts": ["an", "ou", "on"], "a": "an"}, {"q": "🐘 éléphant", "s": "Écoute éléphant. Quel son entends-tu ?", "opts": ["on", "oi", "an"], "a": "an"}, {"q": "🧒 enfant", "s": "Écoute enfant. Quel son entends-tu ?", "opts": ["ch", "an", "oi"], "a": "an"}, {"q": "🩳 pantalon", "s": "Écoute pantalon. Quel son entends-tu ?", "opts": ["an", "ch", "ou"], "a": "an"}, {"q": "🐟 poisson", "s": "Écoute poisson. Quel son entends-tu ?", "opts": ["oi", "ou", "on"], "a": "oi"}, {"q": "🚗 voiture", "s": "Écoute voiture. Quel son entends-tu ?", "opts": ["on", "an", "oi"], "a": "oi"}, {"q": "🐦 oiseau", "s": "Écoute oiseau. Quel son entends-tu ?", "opts": ["ch", "oi", "an"], "a": "oi"}, {"q": "👑 roi", "s": "Écoute roi. Quel son entends-tu ?", "opts": ["oi", "ch", "ou"], "a": "oi"}, {"q": "🐈 chat", "s": "Écoute chat. Quel son entends-tu ?", "opts": ["ch", "ou", "on"], "a": "ch"}, {"q": "🐴 cheval", "s": "Écoute cheval. Quel son entends-tu ?", "opts": ["on", "an", "ch"], "a": "ch"}, {"q": "🐕 chien", "s": "Écoute chien. Quel son entends-tu ?", "opts": ["oi", "ch", "an"], "a": "ch"}, {"q": "👕 chemise", "s": "Écoute chemise. Quel son entends-tu ?", "opts": ["ch", "oi", "ou"], "a": "ch"}];
const homework=[{"q": "🐺 loup", "s": "Écoute loup. Quel son entends-tu ?", "opts": ["ou", "on", "an"], "a": "ou"}, {"q": "🐔 poule", "s": "Écoute poule. Quel son entends-tu ?", "opts": ["an", "oi", "ou"], "a": "ou"}, {"q": "🔴 boule", "s": "Écoute boule. Quel son entends-tu ?", "opts": ["ch", "ou", "oi"], "a": "ou"}, {"q": "🛞 roue", "s": "Écoute roue. Quel son entends-tu ?", "opts": ["ou", "ch", "on"], "a": "ou"}, {"q": "🐑 mouton", "s": "Écoute mouton. Quel son entends-tu ?", "opts": ["on", "ou", "an"], "a": "on"}];
let mode='lesson',idx=0,score=0,locked=false;const $=id=>document.getElementById(id);
function speak(t){if(!('speechSynthesis' in window)){$('feedback').textContent='La voix n’est pas disponible ici.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-CA';u.rate=.78;speechSynthesis.speak(u)}
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}
function reset(){$('content').replaceChildren();$('actions').replaceChildren();$('feedback').textContent='';locked=false}
function render(){
reset();const c=$('content'),a=$('actions'),total=lessons.length+exercises.length+homework.length;
if(mode==='lesson'){
 const l=lessons[idx];$('stage').textContent='Découverte '+(idx+1)+'/'+lessons.length;
 $('bar').style.width=((idx+1)/total*100)+'%';
 const theme=document.createElement('p');theme.className='hint';theme.textContent=l.theme||'';c.append(theme);
 const pic=document.createElement('span');pic.className='picture';pic.textContent=l.emoji;c.append(pic);
 const word=document.createElement('div');word.className='word';word.textContent=l.word;c.append(word);
 if(l.pieces){const group=document.createElement('div');l.pieces.forEach((piece,i)=>{const s=document.createElement('span');s.className='syllable';s.textContent=piece;group.append(s);if(i<l.pieces.length-1){const sep=document.createElement('span');sep.textContent=' + ';group.append(sep)}});c.append(group);}
 a.append(btn('🔊 Écouter',()=>speak(l.say),'secondary'));
 a.append(btn('➜ Suivant',()=>{if(++idx>=lessons.length){mode='exercise';idx=0;score=0;}render()}));
}else if(mode==='exercise'||mode==='homework'){
 const arr=mode==='exercise'?exercises:homework,x=arr[idx];
 $('stage').textContent=(mode==='exercise'?'Je m’entraîne ':'Petit devoir ')+(idx+1)+'/'+arr.length;
 $('bar').style.width=((lessons.length+(mode==='homework'?exercises.length:0)+idx+1)/total*100)+'%';
 const h=document.createElement('div');h.className='word';h.textContent=x.q;c.append(h);
 const choices=document.createElement('div');choices.className='choices';
 x.opts.forEach(o=>choices.append(btn(o,()=>{if(locked)return;if(o===x.a){locked=true;score++;$('feedback').textContent='⭐ Bravo !';a.append(btn('➜ Suivant',()=>{if(++idx>=arr.length){mode=mode==='exercise'?'end':'done';idx=0;}render()}));}else{$('feedback').textContent='Essaie encore !';}},'choice')));
 c.append(choices);a.append(btn('🔊 Écouter',()=>speak(x.s),'secondary'));
}else{
 const done=mode==='done';$('stage').textContent='Bravo !';$('bar').style.width='100%';
 const star=document.createElement('div');star.className='big';star.textContent='⭐';c.append(star);
 const msg=document.createElement('p');msg.textContent=done?'Devoir terminé !':'Tu as terminé les exercices !';c.append(msg);
 a.append(btn('🔁 Recommencer',()=>{mode='lesson';idx=0;score=0;render()},'secondary'));
 if(!done)a.append(btn('📝 Petit devoir',()=>{mode='homework';idx=0;score=0;render()}));
}}
render();</script></body></html>
